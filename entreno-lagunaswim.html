<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrenamiento · Laguna Swim International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E4ECF3; --panel:#FFFFFF; --text:#0F1B2D; --muted:#56657A; --line:#C9D6E2; --field:#F5F8FB;
  --navy:#0B2545; --navy2:#13315C; --gold:#D4A72C; --rope:#C8102E; --pool:#EAF2F8; --ink:#0F1B2D;
  --btn:#0B2545; --btnText:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#07111F; --panel:#0E1C30; --text:#E6EDF5; --muted:#93A3B8; --line:#22364F; --field:#0A1728; --btn:#D4A72C; --btnText:#0B2545; }
}
:root[data-theme="dark"]{ --bg:#07111F; --panel:#0E1C30; --text:#E6EDF5; --muted:#93A3B8; --line:#22364F; --field:#0A1728; --btn:#D4A72C; --btnText:#0B2545; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45}
img{max-width:100%;display:block}
button,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 96px;display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:980px){.wrap{grid-template-columns:380px 1fr;align-items:start}}

/* ---------- editor ---------- */
.editor{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
@media (min-width:980px){.editor{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto}}
.editor h1{font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;font-size:28px;line-height:1;margin:0 0 4px;letter-spacing:.2px}
.editor p.hint{margin:0 0 16px;color:var(--muted);font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.field input[type=text],.field textarea{width:100%;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.field textarea{min-height:260px;font-size:13.5px;line-height:1.4;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace}
.cover-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cover-row img{width:84px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0;font-size:14px}
.actions{display:grid;gap:8px;margin-top:6px}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 14px;font-weight:700;cursor:pointer;background:var(--btn);color:var(--btnText);font-size:15px;text-align:center;text-decoration:none;display:block}
.btn.alt{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.wa{background:#1F9D55;color:#fff}
.btn[disabled]{opacity:.55;cursor:progress}
.status{font-size:13px;color:var(--muted);min-height:18px;margin-top:6px}
.linkout{width:100%;font-size:12px;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px;display:none}
.small{font-size:12.5px;color:var(--muted);margin-top:10px}

/* ---------- viewer mode ---------- */
body.viewer .editor{display:none}
body.viewer .wrap{grid-template-columns:1fr;max-width:840px}
.fab{display:none}
body.viewer .fab{display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 6px 20px rgba(11,37,69,.35);padding:14px 26px;border-radius:999px}

/* ---------- the sheet (always paper-light) ---------- */
.sheet-scroll{overflow-x:auto}
.sheet{background:#fff;color:var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 1px 0 rgba(11,37,69,.08);max-width:820px;margin:0 auto;width:100%}
.sheet.for-pdf{width:780px;max-width:none;border-radius:0;box-shadow:none}
.hero{position:relative;background:var(--navy);color:#fff}
.hero img{width:100%;aspect-ratio:3/2;object-fit:cover}
.hero .plate{padding:22px 26px 20px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%)}
.hero .brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:.8px;color:var(--gold)}
.hero h2{font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;font-size:40px;line-height:.95;margin:6px 0 4px}
.hero .period{font-size:16px;color:#C9D6E6}
.hero .coach{font-size:13px;color:#9FB3CC;margin-top:10px}
.stats{display:flex;gap:0;border-top:1px solid rgba(255,255,255,.14)}
.stats div{flex:1;padding:12px 26px}
.stats div + div{border-left:1px solid rgba(255,255,255,.14)}
.stats b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;line-height:1;color:#fff}
.stats span{font-size:12.5px;color:#9FB3CC}
.quote{margin:0;padding:18px 26px;font-size:17px;font-weight:500;border-bottom:1px solid #E3EAF1;color:var(--navy)}
.quote::before{content:"";display:inline-block;width:14px;height:3px;background:var(--gold);vertical-align:middle;margin-right:10px}

.rope{height:8px;background:repeating-linear-gradient(90deg,var(--rope) 0 14px,#fff 14px 20px,#1E5AA8 20px 34px,#fff 34px 40px);border-top:1px solid #DCE4EC;border-bottom:1px solid #DCE4EC}
.day{padding:22px 26px 18px}
.day-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.day-name{font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;font-size:34px;line-height:.9;color:var(--navy);margin:0}
.day-focus{font-size:15px;color:#46566B;margin-top:4px}
.day-total{text-align:right;flex:none}
.day-total b{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;line-height:1;color:var(--navy)}
.day-total span{display:block;font-size:12px;color:#6A7A8F}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:12px 0 4px;background:#EEF2F6}
.bar i{display:block;height:100%}
.k-warm{background:#7FB3E0}.k-main{background:var(--navy)}.k-cool{background:#B9D3EA}.k-other{background:#9AA7B6}
.barkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:#6A7A8F;margin-bottom:6px}
.barkey em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.barkey em::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}

.sec{margin-top:14px;break-inside:avoid}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--navy);padding-bottom:3px;margin-bottom:2px}
.sec-head h4{margin:0;font-weight:700;font-size:15px;color:var(--navy)}
.sec-head span{font-size:13px;color:#6A7A8F;font-weight:600}
.sec.dry .sec-head{border-bottom-color:var(--gold)}
.set{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid #EDF1F5;break-inside:avoid}
.set:last-child{border-bottom:0}
.set .rx{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;color:var(--navy);white-space:nowrap}
.set .ds{font-size:14.5px;color:#1B2A3D}
.set .tags{display:inline-flex;gap:6px;margin-left:6px;vertical-align:1px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
.r1{background:#DDEEFB;color:#14508A}.r2{background:#FBEFCB;color:#7A5A00}.r3{background:#FAD9DE;color:#9B0D24}.r4,.r5{background:#9B0D24;color:#fff}
.rest{background:#EEF2F6;color:#46566B;font-weight:600}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:3px;vertical-align:middle}
.set .m{font-size:13.5px;color:#6A7A8F;font-weight:600;white-space:nowrap}
.sec.dry .set{grid-template-columns:62px 1fr}
.day-foot{display:flex;justify-content:flex-end;margin-top:10px;font-size:14px;color:var(--navy);font-weight:700}

.legend{padding:16px 26px;background:var(--pool);font-size:13px;color:#46566B;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.legend .tag{margin-right:4px}
.sign{padding:16px 26px 22px;background:var(--navy);color:#C9D6E6;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sign b{color:var(--gold);font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:700;font-size:17px;letter-spacing:.3px}
.empty{padding:40px 26px;color:#6A7A8F}

@media (max-width:520px){
  .hero .plate,.day,.quote,.legend,.sign{padding-left:18px;padding-right:18px}
  .stats div{padding:12px 18px}
  .hero h2{font-size:32px}
  .day-name{font-size:30px}
  .set{grid-template-columns:52px 1fr auto;gap:8px}
  .sec.dry .set{grid-template-columns:52px 1fr}
}
@media print{
  body{background:#fff}
  .editor,.fab{display:none!important}
  .wrap{display:block;padding:0}
  .sheet{box-shadow:none;border-radius:0;max-width:none}
  .day{break-before:page}
  .day.first{break-before:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="editor" aria-label="Crear entrenamiento">
    <h1>Hoja de entrenamiento</h1>
    <p class="hint">Pega el entreno como lo escribes siempre. La hoja se arma sola a la derecha (o abajo, en el cel).</p>

    <div class="field"><label for="f-name">Nadador(a)</label><input type="text" id="f-name" autocomplete="off"></div>
    <div class="field"><label for="f-period">Semana o fecha</label><input type="text" id="f-period" autocomplete="off"></div>
    <div class="field"><label for="f-coach">Firma del coach</label><input type="text" id="f-coach" autocomplete="off"></div>
    <div class="field">
      <label>Portada (opcional)</label>
      <div class="cover-row">
        <img id="cover-thumb" alt="" hidden>
        <input type="file" id="f-cover" accept="image/*" aria-label="Elegir imagen de portada">
        <button class="linkbtn" id="rm-cover" type="button">Quitar portada</button>
      </div>
    </div>
    <div class="field"><label for="f-text">Entrenamiento</label><textarea id="f-text" spellcheck="false"></textarea></div>

    <div class="actions">
      <button class="btn" id="b-pdf" type="button">Descargar PDF</button>
      <button class="btn alt" id="b-link" type="button">Crear link para el nadador</button>
      <a class="btn wa" id="b-wa" href="#" target="_blank" rel="noopener">Mandar link por WhatsApp</a>
    </div>
    <input class="linkout" id="linkout" readonly aria-label="Link del entrenamiento">
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <p class="small">El link abre la hoja en <span id="basehost"></span> y trae su propio botón de descargar PDF. La portada solo va en el PDF, no en el link.</p>
  </aside>

  <main class="sheet-scroll"><article class="sheet" id="sheet"></article></main>
</div>
<button class="btn fab" id="fab-pdf" type="button">Descargar PDF</button>

  m = t.match(/\(\s*D\s*:?\s*(\d+)\s*(?:["”″']{1,2}|s|seg)?\s*\)/i);
  if(m){ o.rest = m[1]; t = (t.slice(0,m.index)+" "+t.slice(m.index+m[0].length)).trim(); }
  m = t.match(/(^|\s)R([1-5])(?=\s|$)/);
  if(m){ o.r = +m[2]; t = (t.slice(0,m.index)+" "+t.slice(m.index+m[0].length)).replace(/\s+/g," ").trim(); }
  m = t.match(/^(\d+)\s*[x×]\s*(\d+)\s*(m\b)?\s*(.*)$/i);
  if(m){ o.rx = m[1]+"×"+m[2]+(m[3]?"":""); o.swim = !!m[3]; o.desc = m[4];
    if(o.swim && !o.sum) o.sum = (+m[1])*(+m[2]); return o; }
  m = t.match(/^(\d+)\s*m\b\s*(.*)$/i);
  if(m){ o.rx = m[1]+" m"; o.swim = true; o.desc = m[2]; if(!o.sum) o.sum = +m[1]; o.single = true; return o; }
  o.desc = t; return o;
}
function kindOf(title){
  var t = title.toLowerCase();
  if(/seco|gimnasio|fuera del agua/.test(t)) return "dry";
  if(/calentamiento|activaci/.test(t)) return "warm";
  if(/principal|serie|bloque|main/.test(t)) return "main";
  if(/enfriamiento|vuelta a la calma|afloje|recuperaci/.test(t)) return "cool";
  return "other";
}
function parse(raw){
  var lines = String(raw).replace(/\r/g,"").split("\n").map(function(l){return l.trim();});
  var intro = [], days = [], day = null, sec = null;
  lines.forEach(function(l){
    if(!l || /^[=_*~-]{3,}$/.test(l)) return;
    var m = l.match(DAY_RE);
    if(m && !/^[·•*]/.test(l)){
      var rest = m[2]||"", tm = rest.match(/\(\s*([\d.,]+)\s*m\s*\)\s*$/i);
      day = { name: cap(m[1]), focus: rest.replace(/\([^)]*\)\s*$/,"").replace(/^[–—:-]\s*/,"").trim(), total: tm?num(tm[1]):0, secs: [] };
      days.push(day); sec = null; return;
    }
    if(!day){ intro.push(l); return; }
    m = l.match(/^total\s*:?\s*([\d.,]+)\s*m/i);
    if(m){ day.total = num(m[1]); return; }
    if(/:$/.test(l) && !/^[·•*–-]\s/.test(l)){
      var t = l.slice(0,-1).trim(), mm = t.match(/\(([^)]*)\)\s*$/);
      sec = { title: t.replace(/\([^)]*\)\s*$/,"").trim(), meta: mm?mm[1].trim():"", items: [] };
      sec.kind = kindOf(sec.title);
      var mt = sec.meta.match(/([\d.,]+)\s*m\b/i); sec.meters = mt?num(mt[1]):0;
      day.secs.push(sec); return;
    }
    var text = l.replace(/^[·•*–-]\s*/,"");
    if(!sec){ sec = { title:"", meta:"", items:[], kind:"other", meters:0 }; day.secs.push(sec); }
    sec.items.push(parseItem(text));
  });
  days.forEach(function(d){
    var sumAll = 0;
    d.secs.forEach(function(s){
      if(!s.meters && s.kind!=="dry"){ s.meters = s.items.reduce(function(a,i){return a+(i.swim?(i.sum||0):0);},0); }
      if(s.kind!=="dry") sumAll += s.meters;
    });
    if(!d.total) d.total = sumAll;
  });
  return { intro: intro, days: days };
}

/* ---------- render ---------- */
var KLABEL = { warm:"Calentamiento", main:"Principal", cool:"Enfriamiento", other:"Otro" };
function render(data, opts){
  var p = parse(data.text), week = p.days.reduce(function(a,d){return a+d.total;},0);
  var h = '<header class="hero">';
  if(opts.cover) h += '<img src="'+opts.cover+'" alt="Portada del entrenamiento">';
  h += '<div class="plate"><div class="brand">Laguna Swim International</div>';
  if(!opts.cover || !opts.hideNameOnCover) h += '<h2>'+esc(data.name||"Tu entrenamiento")+'</h2>';
  if(data.period) h += '<div class="period">'+esc(data.period)+'</div>';
  if(data.coach) h += '<div class="coach">Plan de '+esc(data.coach)+'</div>';
  h += '</div>';
  if(p.days.length) h += '<div class="stats"><div><b>'+p.days.length+'</b><span>'+(p.days.length===1?"sesión":"sesiones")+'</span></div><div><b>'+fmt(week)+' m</b><span>total de la semana</span></div></div>';
  h += '</header>';
  if(p.intro.length) h += '<p class="quote">'+esc(p.intro.join(" "))+'</p>';
  if(!p.days.length){
    h += '<div class="empty">Pega el entrenamiento empezando cada día con su nombre, por ejemplo: <br><strong>MIÉRCOLES – Recuperación activa (2000 m)</strong></div>';
  }
  var usedR = {};
  p.days.forEach(function(d,di){
    if(di>0) h += '<div class="rope" aria-hidden="true"></div>';
    h += '<section class="day'+(di===0?" first":"")+'"><div class="day-head"><div><h3 class="day-name">'+esc(d.name)+'</h3>';
    if(d.focus) h += '<div class="day-focus">'+esc(d.focus)+'</div>';
    h += '</div><div class="day-total"><b>'+fmt(d.total)+' m</b><span>en el agua</span></div></div>';
    var wet = d.secs.filter(function(s){return s.kind!=="dry" && s.meters;}), wsum = wet.reduce(function(a,s){return a+s.meters;},0);
    if(wsum){
      h += '<div class="bar" role="img" aria-label="Reparto de metros por bloque">';
      wet.forEach(function(s){ h += '<i class="k-'+s.kind+'" style="width:'+(s.meters/wsum*100).toFixed(2)+'%"></i>'; });
      h += '</div><div class="barkey">';
      var seen = {};
      wet.forEach(function(s){ if(seen[s.kind]) return; seen[s.kind]=1;
        var tot = wet.filter(function(x){return x.kind===s.kind;}).reduce(function(a,x){return a+x.meters;},0);
        h += '<em style="--c:var(--c-'+s.kind+')" class="kk-'+s.kind+'">'+KLABEL[s.kind]+' '+fmt(tot)+' m</em>'; });
      h += '</div>';
    }
    d.secs.forEach(function(s){
      h += '<div class="sec '+s.kind+'">';
      if(s.title) h += '<div class="sec-head"><h4>'+esc(s.title)+'</h4>'+(s.meta?'<span>'+esc(s.meta)+'</span>':'')+'</div>';
      s.items.forEach(function(i){
        var tags = "";
        if(i.r){ usedR[i.r]=1; tags += '<span class="tag r'+i.r+'">R'+i.r+'</span>'; }
        if(i.rest) tags += '<span class="tag rest">'+esc(i.rest)+' s descanso</span>';
        h += '<div class="set"><span class="rx">'+(i.rx?esc(i.rx):'<i class="dot"></i>')+'</span><span class="ds">'+esc(i.desc||"")+(tags?'<span class="tags">'+tags+'</span>':'')+'</span>';
        if(s.kind!=="dry") h += '<span class="m">'+(i.swim && i.sum && !i.single?fmt(i.sum)+' m':'')+'</span>';
        h += '</div>';
      });
      h += '</div>';
    });
    h += '</section>';
  });
  if(p.days.length){
    h += '<div class="legend">';
    var rs = Object.keys(usedR).sort();
    if(rs.length){ h += '<span>'+rs.map(function(r){return '<span class="tag r'+r+'">R'+r+'</span>';}).join("")+' ritmo, de más suave a más fuerte</span>'; }
    h += '<span><span class="tag rest">20 s descanso</span> pausa entre cada repetición</span></div>';
  }
  h += '<footer class="sign"><b>Fuertes y Valientes — Josué 1:9</b><span>Laguna Swim International · Torreón</span></footer>';
  $("sheet").innerHTML = h;
}
/* bar legend colors */
document.documentElement.style.setProperty("--c-warm","#7FB3E0");
document.documentElement.style.setProperty("--c-main","#0B2545");
document.documentElement.style.setProperty("--c-cool","#B9D3EA");
document.documentElement.style.setProperty("--c-other","#9AA7B6");

/* ---------- state ---------- */
function current(){ return { name:$("f-name").value.trim(), period:$("f-period").value.trim(), coach:$("f-coach").value.trim(), text:$("f-text").value }; }
function store(k,v){ try{ localStorage.setItem("ls-entreno-"+k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem("ls-entreno-"+k); }catch(e){ return null; } }
function status(msg){ $("status").textContent = msg||""; }
function fileName(d){ return ("Entreno "+(d.name||"")+" "+(d.period||"")).replace(/[\\/:*?"<>|]+/g,"").replace(/\s+/g," ").trim()+".pdf"; }

/* ---------- link ---------- */
function linkBase(){
  if(/lagunaswim\.net$/i.test(location.hostname) || /github\.io$/i.test(location.hostname)) return location.origin+location.pathname;
  return LINK_BASE;
}
function makeLink(d){
  if(!window.LZString) return "";
  return linkBase()+"#p="+LZString.compressToEncodedURIComponent(JSON.stringify({v:1,n:d.name,p:d.period,c:d.coach,t:d.text}));
}
function readLink(){
  var m = location.hash.match(/[#&]p=([^&]+)/);
  if(!m || !window.LZString) return null;
  try{ var o = JSON.parse(LZString.decompressFromEncodedURIComponent(m[1])); return o && o.t ? {name:o.n||"",period:o.p||"",coach:o.c||"",text:o.t} : null; }catch(e){ return null; }
}

/* ---------- pdf ---------- */
var downloadsP = (window.claude && typeof window.claude.use==="function") ? window.claude.use("downloads").catch(function(){return null;}) : Promise.resolve(null);
function makePdf(d, btns){
  if(!window.html2pdf){ window.print(); return; }
  btns.forEach(function(b){ b.disabled = true; b.dataset.l = b.textContent; b.textContent = "Armando PDF…"; });
  var el = $("sheet"); el.classList.add("for-pdf");
  var opt = { margin:[8,0,10,0], filename:fileName(d), image:{type:"jpeg",quality:0.95},
    html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",windowWidth:900},
    jsPDF:{unit:"mm",format:"letter",orientation:"portrait"},
    pagebreak:{mode:["css"],before:".day:not(.first)",avoid:[".set",".sec-head",".day-head"]} };
  var done = function(){ el.classList.remove("for-pdf"); btns.forEach(function(b){ b.disabled=false; b.textContent=b.dataset.l; }); };
  downloadsP.then(function(dl){
    if(dl){
      return html2pdf().set(opt).from(el).outputPdf("blob").then(function(blob){
        done();
        return dl.save({filename:opt.filename,data:blob}).then(function(){ status("PDF listo."); },function(e){
          if(e && e.code==="declined") status("Descarga cancelada.");
          else if(e && e.code==="rate_limited") status("Ya hay una descarga abierta. Intenta en un momento.");
          else status("No se pudo guardar aquí. Prueba desde el link.");
        });
      });
    }
    return html2pdf().set(opt).from(el).save().then(function(){ done(); status("PDF descargado."); });
  }).catch(function(){ done(); status("No se pudo crear el PDF. Intenta de nuevo."); });
}

/* ---------- init ---------- */
var shared = readLink();
if(shared){
  document.body.classList.add("viewer");
  document.title = "Entrenamiento de "+(shared.name||"Laguna Swim");
  render(shared,{cover:null});
  $("fab-pdf").addEventListener("click",function(){ makePdf(shared,[$("fab-pdf")]); });
} else {
  $("f-name").value = DEFAULT.name;
  $("f-period").value = DEFAULT.period;
  $("f-coach").value = load("coach") || DEFAULT.coach;
  $("f-text").value = DEFAULT.text;
  $("basehost").textContent = linkBase().replace(/^https?:\/\//,"");
  var thumb = function(){ if(cover){ $("cover-thumb").src = cover; $("cover-thumb").hidden = false; $("rm-cover").hidden = false; } else { $("cover-thumb").hidden = true; $("rm-cover").hidden = true; } };
  var refresh = function(){ render(current(),{cover:cover,hideNameOnCover:false}); updateWa(); };
  var t; ["f-name","f-period","f-coach","f-text"].forEach(function(id){ $(id).addEventListener("input",function(){ clearTimeout(t); t=setTimeout(refresh,150); $("linkout").style.display="none"; }); });
  $("f-coach").addEventListener("change",function(){ store("coach",$("f-coach").value.trim()); });
  $("f-cover").addEventListener("change",function(e){
    var f = e.target.files && e.target.files[0]; if(!f) return;
    var r = new FileReader(); r.onload = function(){
      var img = new Image(); img.onload = function(){
        var c = document.createElement("canvas"), s = Math.min(1,1400/img.width); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); cover = c.toDataURL("image/jpeg",0.85); thumb(); refresh();
      }; img.src = r.result; }; r.readAsDataURL(f);
  });
  $("rm-cover").addEventListener("click",function(){ cover = null; $("f-cover").value = ""; thumb(); refresh(); });
  $("b-pdf").addEventListener("click",function(){ makePdf(current(),[$("b-pdf")]); });
  $("b-link").addEventListener("click",function(){
    var url = makeLink(current()); if(!url){ status("No se pudo crear el link."); return; }
    var box = $("linkout"); box.value = url; box.style.display = "block"; box.select();
    var ok = function(){ status("Link copiado. Pégalo en WhatsApp."); }, no = function(){ status("Link listo: mantén presionado para copiarlo."); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok,no); else no();
  });
  function updateWa(){
    var d = current(), url = makeLink(d);
    var first = (d.name||"").replace(/^(dra?\.|lic\.|ing\.)\s*/i,"").split(" ")[0];
    var msg = "¡Hola"+(first?" "+first:"")+"! Aquí está tu entrenamiento"+(d.period?" ("+d.period.toLowerCase()+")":"")+" 🏊‍♀️\n"+url+"\n\nÁbrelo y descárgalo en PDF si lo quieres llevar a la alberca. ¡Fuertes y valientes!";
    $("b-wa").href = "https://wa.me/?text="+encodeURIComponent(msg);
  }
  thumb(); refresh();
}
})();
</script>
