<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#071e38">
<title>Laguna Swim International</title>
<link rel="apple-touch-icon" href="https://res.cloudinary.com/dg84htrzg/image/upload/v1778390443/ChatGPT_Image_9_may_2026_11_17_28_p.m._geedfw.png">
<meta name="apple-mobile-web-app-title" content="Laguna Swim">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg-deep: #050f1c;
  --bg-main: #071e38;
  --bg-team-top: #0a2956;
  --bg-team-mid: #1e5a9e;
  --bg-team-low: #6bb8e8;
  --bg-card: rgba(255,255,255,0.06);
  --bg-card-border: rgba(255,255,255,0.10);
  --accent: #38bdf8;
  --accent-strong: #0ea5e9;
  --accent-soft: #7ab8e8;
  --gold: #ffd700;
  --gold-dim: #b8860b;
  --success: #22c55e;
  --danger: #ef4444;
  --purple: #a855f7;
  --bnav-h: 65px;
  --spons-h: 48px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
html {
  background: var(--bg-team-top);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: linear-gradient(180deg, var(--bg-team-top) 0%, var(--bg-team-mid) 60%, var(--bg-team-low) 100%);
  background-attachment: fixed;
  color: #fff;
  min-height: 100vh;
  padding-bottom: 0;
}
/* ====== TABS / NAV ====== */
.bnav {
  position: fixed; bottom: 0; left: 0; right: 0; height: var(--bnav-h);
  background: var(--bg-deep);
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.bnav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; opacity: 0.4;
  border: none; background: none; color: #fff; padding: 0;
  transition: opacity 0.15s;
}
.bnav-item.active { opacity: 1; color: var(--accent); }
.bnav-icon { font-size: 1.25rem; }
.bnav-label { font-size: 0.6rem; font-weight: 700; }
.tab { display: none; min-height: calc(100vh - var(--bnav-h)); flex-direction: column; padding: 0 1rem calc(var(--bnav-h) + var(--spons-h) + env(safe-area-inset-bottom) + 28px); }
.tab.active { display: flex; }
/* ====== HEADER ====== */
.hdr {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.8rem 0 0.5rem;
}
.logo-img {
  width: 42px; height: 42px; border-radius: 10px; object-fit: contain; flex-shrink: 0;
}
.logo-main { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.3px; }
.logo-main em { color: var(--accent); font-style: normal; }
.logo-sub { font-size: 0.58rem; color: var(--accent-soft); letter-spacing: 1px; }
.hdr-status {
  margin-left: auto;
  font-size: 0.65rem; padding: 3px 8px; border-radius: 20px;
  background: rgba(255,255,255,0.07);
}
/* ====== INTERNAL SCREENS (within tabs) ====== */
.screen { display: none; }
.screen.active { display: block; }
/* Las pantallas del cronometro (s-role, s-setup, s-lobby, s-startup, s-race...)
   viven a nivel de body, FUERA de los .tab, asi que necesitan su propio
   espacio abajo para librar el menu inferior + la barra de patrocinadores */
body > .screen { padding-bottom: calc(var(--bnav-h) + var(--spons-h) + env(safe-area-inset-bottom) + 28px); }
/* Al activar una pantalla del crono, ocultar el tab-timer del inicio
   (si no, queda como una caja vacia alta y deja un hueco enorme arriba) */
body.chrono-active #tab-timer { display: none !important; }
/* ====== CARDS / FORMS ====== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--bg-card-border);
  border-radius: 16px;
  padding: 1.1rem;
  margin-bottom: 0.8rem;
}
.btn {
  width: 100%; padding: 0.85rem;
  border-radius: 12px; border: none;
  font-size: 0.95rem; font-weight: 700;
  cursor: pointer; margin-bottom: 0.55rem;
  transition: transform 0.1s;
  touch-action: manipulation;
  -webkit-appearance: none;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-sky { background: var(--accent-strong); color: #fff; }
.btn-gray { background: rgba(255,255,255,0.09); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
.btn-red { background: #b91c1c; color: #fff; }
.btn-green { background: #15803d; color: #fff; }
.btn-orange { background: #ea580c; color: #fff; }
.btn-wa { background: #16a34a; color: #fff; }
.btn-gold {
  background: linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
  color: #1a0a00; font-weight: 800;
}
.btn-sm { width: auto; padding: 0.45rem 0.9rem; font-size: 0.78rem; border-radius: 9px; margin-bottom: 0; }
input, select, textarea {
  width: 100%; padding: 0.7rem 0.9rem;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.07);
  color: #fff; font-size: 0.93rem;
  margin-bottom: 0.5rem; outline: none;
  -webkit-appearance: none;
  font-family: inherit;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input::placeholder { color: rgba(255,255,255,0.3); }
select option { background: var(--bg-main); color: #fff; }
label { font-size: 0.76rem; color: var(--accent-soft); margin-bottom: 3px; display: block; font-weight: 500; }
/* ====== TIMER ====== */
.timer-big {
  font-size: 3.4rem; font-weight: 800; text-align: center;
  letter-spacing: 3px;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  line-height: 1; padding: 0.3rem 0;
}
.lane-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.7rem 0.9rem; border-radius: 13px;
  margin-bottom: 0.5rem;
  border: 2px solid transparent;
}
.lane-row.live { background: #0f3460; border-color: #1d6fa4; }
.lane-row.done { background: #064e3b; border-color: #15803d; }
.code-display {
  font-size: 2.4rem; font-weight: 800;
  letter-spacing: 10px; color: var(--accent);
  text-align: center; padding: 0.4rem 0;
  font-variant-numeric: tabular-nums;
}
.role-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--bg-card-border);
  border-radius: 16px; padding: 1.1rem; margin-bottom: 0.7rem;
  cursor: pointer;
  display: flex; align-items: center; gap: 1rem;
  touch-action: manipulation;
  transition: transform 0.1s;
}
.role-card:active { transform: scale(0.97); }
/* Big buttons for timekeeper */
.stop-btn {
  width: 100%; padding: 2.5rem 1rem;
  border-radius: 20px;
  background: #1d6fa4; border: 3px solid var(--accent);
  color: #fff; font-size: 1.5rem; font-weight: 800;
  cursor: pointer; text-align: center;
  margin-bottom: 0.6rem;
  touch-action: manipulation;
  transition: transform 0.05s;
}
.stop-btn:active { transform: scale(0.95); }
.parcial-btn {
  width: 100%; padding: 1.4rem;
  border-radius: 14px;
  background: #7c3aed; border: 2px solid var(--purple);
  color: #fff; font-size: 1.2rem; font-weight: 700;
  cursor: pointer; text-align: center;
  margin-bottom: 0.6rem;
  touch-action: manipulation;
}
.parcial-btn:active { transform: scale(0.96); }
.parcial-list {
  background: rgba(0,0,0,0.2);
  border-radius: 10px;
  padding: 0.6rem;
  margin-top: 0.4rem;
}
.parcial-item {
  display: flex; justify-content: space-between;
  font-size: 0.75rem; padding: 3px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  font-variant-numeric: tabular-nums;
}
.parcial-item:last-child { border-bottom: none; }
/* ====== RESULTS ====== */
.res-row {
  display: flex; align-items: flex-start;
  gap: 0.8rem; padding: 0.75rem 0.9rem;
  border-radius: 12px; margin-bottom: 0.4rem;
}
.res-row:nth-child(1) { background: rgba(250,204,21,0.08); border: 1px solid rgba(250,204,21,0.2); }
.res-row:nth-child(2) { background: rgba(148,163,184,0.08); border: 1px solid rgba(148,163,184,0.15); }
.res-row:nth-child(3) { background: rgba(180,83,9,0.08); border: 1px solid rgba(180,83,9,0.15); }
.res-row:nth-child(n+4) { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); }
/* ====== AUTH MODAL ====== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
}
.modal-overlay.center { align-items: center; padding: 1rem; }
.modal-hidden { display: none !important; }
.modal-box {
  background: #0a1f38; border-radius: 20px 20px 0 0;
  padding: 1.5rem; width: 100%; max-width: 480px;
  max-height: 85vh; overflow-y: auto;
  padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
}
.auth-box {
  background: #0d2a4a;
  border: 1px solid rgba(56,189,248,0.25);
  border-radius: 24px;
  padding: 1.8rem 1.5rem;
  width: 100%; max-width: 400px;
}
.auth-error {
  background: rgba(185,28,28,0.15);
  border: 1px solid rgba(185,28,28,0.4);
  border-radius: 10px;
  padding: 0.6rem 0.8rem;
  font-size: 0.78rem; color: #fca5a5;
  margin-bottom: 0.7rem;
}
/* ====== LANE SELECTOR ====== */
.mode-pick, .dur-pick {
  flex:1; min-width:78px; padding:11px 8px;
  border-radius:10px; font-size:0.82rem; font-weight:800; cursor:pointer;
  border:2px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.45);
  transition:all 0.15s;
}
.mode-pick.on, .dur-pick.on {
  border-color:var(--accent);
  background:rgba(56,189,248,0.18);
  color:#fff;
}
.lane-pick {
  width: 44px; height: 44px;
  border-radius: 10px;
  font-size: 1rem; font-weight: 800;
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.3);
  transition: all 0.15s;
}
.lane-pick.on {
  border-color: var(--accent);
  background: rgba(56,189,248,0.18);
  color: var(--accent);
}
/* ====== SPINNER ====== */
.spinner {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid rgba(56,189,248,0.3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* ====== PLACEHOLDER (próximas iteraciones) ====== */
.placeholder-box {
  background: rgba(255,255,255,0.04);
  border: 1px dashed rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 2rem 1.5rem;
  text-align: center;
}
/* ====== AD BANNER ====== */
.ad-banner {
  width: 100%;
  background: #0a1f38;
  border: 1px solid rgba(56,189,248,0.15);
  border-radius: 10px;
  padding: 0.5rem 0.8rem;
  display: flex; align-items: center; gap: 0.6rem;
  margin-bottom: 0.6rem;
}
.ad-tag {
  font-size: 0.58rem; color: var(--accent);
  border: 1px solid rgba(56,189,248,0.5);
  border-radius: 4px; padding: 1px 4px;
  white-space: nowrap;
}
.ad-text { font-size: 0.74rem; color: rgba(255,255,255,0.55); flex: 1; }
.ad-logo { font-size: 0.76rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
/* ====== FOOTER ====== */
.footer-bar {
  text-align: center;
  padding: 1rem 0 0.5rem;
  font-size: 0.65rem;
  color: rgba(255,255,255,0.25);
  border-top: 1px solid rgba(255,255,255,0.06);
  margin-top: 1rem;
}
.coach-btn {
  background: none; border: none;
  color: rgba(255,255,255,0.2);
  font-size: 0.62rem;
  cursor: pointer;
  padding: 4px 8px;
  display: inline-block;
}
.coach-logout-btn {
  background: rgba(185,28,28,0.15);
  border: 1px solid rgba(185,28,28,0.3);
  border-radius: 8px;
  color: #fca5a5;
  font-size: 0.7rem;
  cursor: pointer;
  padding: 4px 10px;
  display: none;
}
/* ====== STATS / PROGRAMS ====== */
.stat-row { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; }
.stat-box { flex: 1; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 0.7rem; text-align: center; }
.stat-num { font-size: 1.25rem; font-weight: 800; color: var(--accent); }
.stat-lbl { font-size: 0.64rem; color: var(--accent-soft); margin-top: 2px; }
.prog-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--bg-card-border);
  border-radius: 14px;
  padding: 1rem; margin-bottom: 0.6rem;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; touch-action: manipulation;
}
.prog-card:active { transform: scale(0.98); }
/* ====== BOOK CARD ====== */
.book-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 16px;
  padding: 1rem; margin-bottom: 0.8rem;
  display: flex; gap: 0.9rem;
}
.book-cover {
  width: 70px; min-width: 70px; height: 98px;
  border-radius: 8px; background: #0f3460;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem;
}
.book-info { flex: 1; display: flex; flex-direction: column; gap: 0.25rem; }
.book-title { font-weight: 800; font-size: 0.9rem; line-height: 1.3; }
.book-desc { font-size: 0.72rem; color: var(--accent-soft); line-height: 1.4; }
.book-price { font-size: 1.1rem; font-weight: 800; color: var(--accent); }
.book-lang {
  font-size: 0.62rem;
  background: rgba(56,189,248,0.12);
  color: var(--accent);
  border-radius: 20px;
  padding: 2px 8px;
  display: inline-block;
  width: fit-content;
  margin-bottom: 2px;
}
.book-btns { display: flex; gap: 0.5rem; margin-top: 0.3rem; flex-wrap: wrap; }
/* ====== RECORD ANIMATION ====== */
@keyframes recordPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
  50% { box-shadow: 0 0 40px rgba(255,215,0,0.7); }
}
.new-record {
  animation: recordPulse 1.5s ease-in-out infinite;
  border: 2px solid var(--gold) !important;
}
.record-flash {
  position: fixed; inset: 0;
  background: radial-gradient(circle, rgba(255,215,0,0.3), transparent);
  z-index: 500; pointer-events: none;
  animation: recordFlash 2s ease-out;
}
@keyframes recordFlash {
  0% { opacity: 0; transform: scale(0.8); }
  20% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.4); }
}
.record-toast {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
  color: #1a0a00;
  padding: 0.8rem 1.4rem;
  border-radius: 50px;
  font-weight: 800; font-size: 0.9rem;
  z-index: 600;
  box-shadow: 0 4px 20px rgba(255,215,0,0.5);
  animation: toastSlide 4s ease-out forwards;
}
@keyframes toastSlide {
  0% { transform: translate(-50%, -100px); opacity: 0; }
  15%, 85% { transform: translate(-50%, 0); opacity: 1; }
  100% { transform: translate(-50%, -100px); opacity: 0; }
}
/* Connection indicator */
.conn-ok { background: rgba(34,197,94,0.15); color: var(--success); }
.conn-bad { background: rgba(239,68,68,0.15); color: var(--danger); }
/* ====== ACORDEÓN CALCULADORA ====== */
.acc-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.8rem 1rem;
  background: rgba(56,189,248,0.06);
  border: 1px solid rgba(56,189,248,0.25);
  border-radius: 14px;
  cursor: pointer;
  margin-bottom: 0.5rem;
}
.acc-body {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 1rem;
}
.calc-btn {
  padding: 0.45rem 0.3rem;
  border-radius: 10px;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.6);
  font-size: 0.7rem; font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  width: 100%;
}
.calc-btn.on {
  border-color: var(--accent);
  background: rgba(56,189,248,0.15);
  color: var(--accent);
}
/* ====== PANTALLA SALIDA ====== */
.start-clock {
  font-size: 4.5rem; font-weight: 900;
  text-align: center;
  letter-spacing: 4px;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  line-height: 1;
  padding: 2rem 0 1.5rem;
  text-shadow: 0 0 30px rgba(56,189,248,0.3);
}
.start-clock.preparing {
  color: var(--gold);
  animation: pulseGold 1s ease-in-out infinite;
  text-shadow: 0 0 30px rgba(255,215,0,0.5);
}
@keyframes pulseGold {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.05); opacity: 0.85; }
}
.start-btn {
  width: 100%;
  padding: 2.2rem 1rem;
  border-radius: 22px;
  background: linear-gradient(135deg, #15803d, #22c55e);
  border: 3px solid #4ade80;
  color: #fff;
  font-size: 1.6rem; font-weight: 900;
  letter-spacing: 2px;
  cursor: pointer;
  text-align: center;
  box-shadow: 0 6px 24px rgba(34,197,94,0.4);
  touch-action: manipulation;
  transition: transform 0.05s;
}
.start-btn:active { transform: scale(0.96); }
.start-btn:disabled {
  background: linear-gradient(135deg, #555, #777);
  border-color: #888;
  cursor: not-allowed;
  box-shadow: none;
}
.beep-indicator {
  display: flex; justify-content: center; gap: 0.8rem;
  margin: 1rem 0;
}
.beep-dot {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 2px solid rgba(255,255,255,0.25);
  transition: all 0.2s;
}
.beep-dot.on {
  background: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 16px var(--gold);
  transform: scale(1.3);
}
.beep-dot.long {
  width: 26px; height: 26px;
}
.beep-dot.long.on {
  background: var(--success);
  border-color: var(--success);
  box-shadow: 0 0 20px var(--success);
}
/* ====== ITEM TIENDA ARTÍCULO ====== */
.item-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 14px;
  padding: 0.9rem;
  margin-bottom: 0.7rem;
  display: flex; gap: 0.8rem; align-items: center;
}
.item-icon {
  width: 56px; min-width: 56px; height: 56px;
  border-radius: 10px;
  background: linear-gradient(135deg, #0c3460, #1d6fa4);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.7rem;
}
.item-info { flex: 1; min-width: 0; }
.item-title { font-weight: 800; font-size: 0.88rem; }
.item-desc { font-size: 0.7rem; color: var(--accent-soft); margin-top: 1px; }
.item-price { font-size: 0.92rem; font-weight: 800; color: var(--accent); margin-top: 2px; }
.section-title {
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin: 1rem 0 0.6rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid rgba(56,189,248,0.15);
}
/* ====== WORKOUT TAB ====== */
.wk-btn {
  padding: 0.6rem 0.4rem;
  border-radius: 10px;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.6);
  font-size: 0.78rem; font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  width: 100%;
  text-align: center;
  line-height: 1.2;
}

/* ============================================================
   NUEVO V3: INICIO ESTILO GOOGLE + FLUIDEZ
   ============================================================ */

/* ===== HERO ESTILO GOOGLE ===== */
.v3-hero-google {
  min-height: calc(100vh - var(--bnav-h) - var(--spons-h) - 70px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 1rem 1.5rem 2rem;
  position: relative;
  animation: v3FadeIn 0.6s ease-out;
}
@keyframes v3FadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.v3-hero-logo-wrap {
  width: 180px;
  height: 180px;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: v3LogoEntry 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes v3LogoEntry {
  from { opacity: 0; transform: scale(0.7); }
  to { opacity: 1; transform: scale(1); }
}
.v3-hero-logo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 8px 30px rgba(255,215,0,0.25));
}
.v3-hero-brand {
  font-size: 2.4rem;
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 0%, #7ec8e8 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
  animation: v3FadeUp 0.6s 0.15s ease-out backwards;
}
.v3-hero-brand em {
  background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-style: normal;
}
.v3-hero-int {
  font-size: 0.7rem;
  letter-spacing: 8px;
  color: var(--gold);
  font-weight: 800;
  text-transform: uppercase;
  margin-bottom: 1rem;
  animation: v3FadeUp 0.6s 0.25s ease-out backwards;
}
.v3-hero-tagline {
  font-size: 0.85rem;
  font-style: italic;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.5px;
  margin-bottom: 2rem;
  animation: v3FadeUp 0.6s 0.35s ease-out backwards;
}
.v3-hero-tagline::before,
.v3-hero-tagline::after {
  content: '"';
  color: var(--gold);
  opacity: 0.6;
}
@keyframes v3FadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* CTA principal único y prominente */
.v3-hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.95rem 2rem;
  background: linear-gradient(135deg, var(--gold) 0%, #ffea4d 100%);
  color: #051a3a;
  border: none;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 900;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 50px;
  box-shadow: 0 6px 24px rgba(255,215,0,0.4), 0 2px 0 #b89500;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  animation: v3FadeUp 0.6s 0.45s ease-out backwards, v3Pulse 2.5s 1.5s infinite;
  position: relative;
  overflow: hidden;
}
.v3-hero-cta::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transition: left 0.6s;
}
.v3-hero-cta:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 32px rgba(255,215,0,0.5), 0 4px 0 #b89500;
}
.v3-hero-cta:hover::before { left: 100%; }
.v3-hero-cta:active {
  transform: translateY(2px);
  box-shadow: 0 2px 12px rgba(255,215,0,0.3);
}
@keyframes v3Pulse {
  0%, 100% { box-shadow: 0 6px 24px rgba(255,215,0,0.4), 0 2px 0 #b89500; }
  50% { box-shadow: 0 6px 32px rgba(255,215,0,0.6), 0 2px 0 #b89500; }
}
.v3-hero-cta .icon { font-size: 1.1rem; }
.v3-hero-cta-badge {
  display: inline-block;
  background: #ff6b35;
  color: #fff;
  font-size: 0.5rem;
  padding: 2px 6px;
  border-radius: 100px;
  margin-left: 4px;
  letter-spacing: 1.5px;
  vertical-align: middle;
}

/* Indicador scroll abajo */
.v3-hero-scroll-hint {
  position: absolute;
  bottom: 1rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 0.6rem;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  font-weight: 700;
  animation: v3ScrollHint 2s ease-in-out infinite;
  cursor: pointer;
}
@keyframes v3ScrollHint {
  0%, 100% { opacity: 0.4; transform: translate(-50%, 0); }
  50% { opacity: 0.9; transform: translate(-50%, 6px); }
}
.v3-hero-scroll-hint .chev {
  font-size: 1.2rem;
  color: var(--gold);
}

/* ===== TRANSICIONES FLUIDAS GENERALES ===== */
html { scroll-behavior: smooth; }

body.v3-fluid * {
  /* Transición global sutil para botones, cards, etc */
  transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
}

/* Tabs fade-in al activarse */
body.v3-fluid .tab.active {
  animation: v3TabIn 0.35s ease-out;
}
@keyframes v3TabIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cards aparecen suavemente al scroll */
body.v3-fluid .v2-section,
body.v3-fluid .v3-section {
  animation: v3FadeUp 0.5s ease-out;
}

/* Bottom nav items con feedback más vivo */
body.v3-fluid .bnav-item {
  transition: color 0.2s ease, background 0.2s ease;
}
body.v3-fluid .bnav-item:active {
  background: rgba(255,215,0,0.08);
}

/* Botones generales con feedback táctil */
body.v3-fluid button,
body.v3-fluid .v2-action-card,
body.v3-fluid .v2-game-poster,
body.v3-fluid .v2-event-poster,
body.v3-fluid .v2-coach-poster {
  transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}
body.v3-fluid .v2-action-card:active,
body.v3-fluid .v2-event-poster:active,
body.v3-fluid .v2-coach-poster:active {
  transform: scale(0.98);
}

/* ===== SECCIONES "ABAJO DEL FOLD" en home ===== */
.v3-below-fold {
  padding: 2rem 0 1rem;
  border-top: 1px solid rgba(255,215,0,0.15);
  margin-top: 1rem;
  animation: v3FadeUp 0.6s ease-out;
}
.v3-below-divider {
  text-align: center;

}
.v3-below-divider-text {

  letter-spacing: 4px;
  color: var(--gold);
  font-weight: 800;
  text-transform: uppercase;
  padding: 0 1rem;
  background: var(--depth-deep);
  position: relative;
  top: -8px;
}

   FIN V3

/* ============================================================
   NUEVO V5: HERO ESTILO SPEEDO (editorial, foto grande)
   ============================================================ */
.v5-hero {
  position: relative;

  flex-direction: column;

.v5-hero::before {
  content: '';
  position: absolute;

  background:

/* ============================================================
   EL MAR QUE TE LLAMA — capa de ambiente oceánico (aditiva)
   ============================================================ */
#oc-ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
#oc-ambient .oc-depth{position:absolute;inset:0;mix-blend-mode:screen;background:
  radial-gradient(120% 70% at 50% -12%, rgba(130,205,255,0.20) 0%, transparent 55%),
  radial-gradient(140% 95% at 50% 120%, rgba(3,12,28,0.55) 0%, transparent 60%);}
#oc-ambient .oc-rays{position:absolute;left:-25%;right:-25%;top:-30%;height:160%;
  transform-origin:50% 0;mix-blend-mode:screen;
  background:repeating-linear-gradient(100deg,
     transparent 0,transparent 70px,
     rgba(170,225,255,0.05) 70px,rgba(170,225,255,0.075) 108px,
     transparent 108px,transparent 184px);
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.35) 45%,transparent 82%);
          mask-image:linear-gradient(180deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.35) 45%,transparent 82%);
  animation:ocRays 15s ease-in-out infinite alternate;}
#oc-ambient .oc-rays.oc-rays-2{opacity:.8;animation-duration:22s;animation-direction:alternate-reverse;
  background:repeating-linear-gradient(82deg,
     transparent 0,transparent 95px,
     rgba(120,210,255,0.04) 95px,rgba(120,210,255,0.06) 132px,
     transparent 132px,transparent 230px);}
@keyframes ocRays{0%{transform:skewX(-7deg) translateX(-3%);}100%{transform:skewX(7deg) translateX(3%);}}
#oc-ambient .oc-caustic{position:absolute;width:80vmax;height:80vmax;border-radius:50%;filter:blur(6px);
  background:radial-gradient(circle at 50% 50%, rgba(56,189,248,0.10) 0%, rgba(56,189,248,0.04) 35%, transparent 70%);
  animation:ocDrift 28s ease-in-out infinite;}
#oc-ambient .oc-caustic.oc-c2{animation-duration:36s;animation-delay:-9s;
  background:radial-gradient(circle at 50% 50%, rgba(20,95,165,0.14) 0%, transparent 65%);}
@keyframes ocDrift{
  0%{transform:translate(-15%,-10%) scale(1);}
  50%{transform:translate(22%,16%) scale(1.15);}
  100%{transform:translate(-15%,-10%) scale(1);}}
#oc-ambient .oc-surface{position:absolute;top:0;left:0;right:0;height:140px;
  background:linear-gradient(180deg, rgba(185,232,255,0.16) 0%, transparent 100%);
  animation:ocSurface 6.5s ease-in-out infinite;}
@keyframes ocSurface{0%,100%{opacity:.5;}50%{opacity:1;}}
#oc-bubbles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
#oc-bubbles .oc-b{position:absolute;bottom:-40px;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,0.92), rgba(180,225,255,0.35) 45%, rgba(120,190,255,0.05) 75%);
  box-shadow:0 0 6px rgba(180,225,255,0.25);
  animation:ocRise linear infinite;}
@keyframes ocRise{
  0%{transform:translateY(0) translateX(0) scale(.55);opacity:0;}
  10%{opacity:.7;}
  50%{transform:translateY(-52vh) translateX(16px) scale(1);}
  90%{opacity:.55;}
  100%{transform:translateY(-105vh) translateX(-12px) scale(1.05);opacity:0;}}
