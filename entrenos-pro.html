<style>
/* Layout: barra superior con pestañas + carril lateral de variables; la semana se arma en tarjetas por día, como pizarra de alberca. */
:root{
  --bg:#EEF3F4; --panel:#FFFFFF; --panel2:#F6F9FA; --ink:#0D2330; --muted:#5A7280; --line:#D3DEE3;
  --accent:#0A6F8C; --accent-ink:#FFFFFF; --rope:#D8432A; --focus:#F2B33D;
  --z-suave:#8EA2AD; --z-aer:#2A9D8F; --z-umb:#D99A2B; --z-alta:#D2523A; --z-vel:#6A4FB3; --z-rit:#BE3779; --z-comb:#3C7BC6; --z-aa:#0B7FA6; --z-mar:#1F5C99;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1A22; --panel:#10232D; --panel2:#142B37; --ink:#E4EEF2; --muted:#93AAB5; --line:#24404D;
  --accent:#3FB3D3; --accent-ink:#06202A; --rope:#F06A50; --focus:#F2B33D;
  --z-suave:#7C929D; --z-aer:#3DBBAA; --z-umb:#E7B04A; --z-alta:#EE7059; --z-vel:#9A82E0; --z-rit:#E36AA6; --z-comb:#6AA4E8; --z-aa:#4CC3E0; --z-mar:#7FA9E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1A22; --panel:#10232D; --panel2:#142B37; --ink:#E4EEF2; --muted:#93AAB5; --line:#24404D;
  --accent:#3FB3D3; --accent-ink:#06202A; --rope:#F06A50; --focus:#F2B33D;
  --z-suave:#7C929D; --z-aer:#3DBBAA; --z-umb:#E7B04A; --z-alta:#EE7059; --z-vel:#9A82E0; --z-rit:#E36AA6; --z-comb:#6AA4E8; --z-aa:#4CC3E0; --z-mar:#7FA9E8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-inline:16px;max-width:1280px;margin:0 auto}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand i{display:inline-block;width:34px;height:10px;border-radius:5px;background:repeating-linear-gradient(90deg,var(--rope) 0 6px,var(--panel) 6px 9px,var(--accent) 9px 15px,var(--panel) 15px 18px)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.who{margin-left:auto;font-size:13px;color:var(--muted)}
@media (max-width:700px){.top-in{gap:6px;padding-block:8px}.brand{font-size:22px}.tabs{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;flex:none}}
main{max-width:1280px;margin:0 auto;padding-block:18px 60px;padding-inline:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:28px} h3{font-size:20px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.rope{background:var(--rope);color:#fff;border-color:var(--rope)}
.btn.sm{padding:4px 8px;font-size:13px}
.ibtn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:14px}
.ibtn:hover{background:var(--panel2);color:var(--ink)}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:900px){.side{position:static}}
.field{display:flex;flex-direction:column;gap:5px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;background:var(--panel2)}
.chk input{margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:7px 4px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.wk-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:14px}
.wk-head .t{flex:1 1 260px;min-width:0}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:30px;line-height:1}
.mixbar{display:flex;height:10px;flex:none;width:100%;border-radius:5px;overflow:hidden;background:var(--panel2)}
.mixbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:-1px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
@media (max-width:420px){.days{grid-template-columns:minmax(0,1fr)}}
.day{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.day-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.day-h .nm{font-family:var(--display);font-size:20px;font-weight:700}
.pill option{color:var(--ink);background:var(--panel)}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;color:#fff;background:var(--c);white-space:nowrap}
.day-h .v{margin-left:auto;font-family:var(--mono);font-size:13px}
.sets{list-style:none;margin:0;padding:6px 0}
.set{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:10px;padding:7px 10px 7px 0;border-bottom:1px dashed var(--line)}
.set:last-child{border-bottom:0}
.set .bar{background:var(--c);border-radius:0 3px 3px 0}
.set .tx{min-width:0;font-size:14px}
.set .tx[contenteditable="true"]{outline:1px dashed var(--accent);border-radius:4px;padding:2px}
.set .meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.set .rol{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.set .vv{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.set .acts{display:flex;gap:0;justify-content:flex-end;opacity:.75}
.set:hover .acts{opacity:1}
.day-f{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap;margin-top:auto}
.note{font-size:13px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
.bar-actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.lib-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.lib-tools .field{flex:1 1 160px}
.lib-list{display:grid;gap:8px}
.lib-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;padding:10px 12px 10px 0}
.lib-item .bar{background:var(--c);border-radius:0 3px 3px 0}
.charts{display:grid;gap:16px}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{width:100%;height:auto;display:block}
#ch-vol{min-width:720px}#ch-mix{min-width:560px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card b.big{font-family:var(--display);font-size:34px;display:block;line-height:1}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.tbl th{background:var(--panel2);font-weight:600}
.tblw{overflow-x:auto}
.modal-bg{position:fixed;inset:0;background:rgba(5,15,20,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.plan-list{display:grid;gap:10px}
.plan-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.plan-row .t{flex:1 1 220px;min-width:0}
.done .tx{text-decoration:line-through;opacity:.6}
.sw-check{width:18px;height:18px}
.pace{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pace div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2)}
.pace b{font-family:var(--mono);font-size:16px}
.insight{border-left:4px solid var(--c,var(--accent));padding:8px 12px;background:var(--panel);border-radius:0 8px 8px 0}
.frase{border:1px solid var(--line);border-left:4px solid var(--rope);background:var(--panel);border-radius:0 var(--r) var(--r) 0;padding:10px 14px;margin:0 0 12px}
.frase .q{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.15}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.steps .panel{position:relative;padding-top:34px}
.steps .n{position:absolute;top:10px;left:14px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.help h3{margin:18px 0 6px}
.help ol,.help ul{margin:0;padding-left:20px}
.help li{margin:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function pick(cands,target,v){

function buildSession(type,target,v,used){

  if(type==='MAR'){ const m=LIB.filter(s=>s.x==='mar'&&!used.has(s.i)); const s=m.length?rnd(m):LIB.find(s=>s.x==='mar'); used.add(s.i);

  add(pick(candidates(s=>s.r==='patada' && (rec? ['aerobico','umbral'].includes(s.c): true),used,v),target*0.14,v),'patada');

}
function planTypes(v){

/* ---- Análisis ---- */
function rAnalisis(){
  const ws=WEEKS.filter(w=>w.n<=51);
  const t1=ws.filter(w=>w.n<=38), t2=ws.filter(w=>w.n>=39);
  const sum=a=>a.reduce((x,w)=>x+(w.v||0),0);
  const mixPct=a=>{const m={};a.forEach(w=>Object.entries(w.mix).forEach(([k,v])=>m[k]=(m[k]||0)+v));const t=Object.values(m).reduce((x,y)=>x+y,0);const o={};Object.entries(m).forEach(([k,v])=>o[k]=Math.round(100*v/t));return o};
  const m1=mixPct(t1.filter(w=>w.n<=9)), m4=mixPct(t1.filter(w=>w.n>=28&&w.n<=36)), mt2=mixPct(t2);
  const ses=[]; WEEKS.forEach(w=>w.dias.forEach(d=>d.v&&ses.push(d.v)));
  const avgS=Math.round(ses.reduce((a,b)=>a+b,0)/ses.length/50)*50;
  const eqc={}; LIB.forEach(s=>s.e.forEach(e=>eqc[e]=(eqc[e]||0)+1));
  const peak=ws.reduce((a,b)=>(b.v||0)>(a.v||0)?b:a);
  return `<h2>Análisis de la temporada</h2><p class="muted" style="max-width:70ch">Calculado sobre las ${ws.length} semanas con fecha (dos temporadas) y ${fmt(LIB.length)} series. El volumen de cada serie se clasificó por intensidad a partir de su texto: zonas AER/VO2/ANA, frecuencia cardiaca, ritmo y RÁPIDO.</p>

  </div>
  <div class="panel charts"><div><h3>Volumen semanal por intensidad</h3><p class="muted" style="margin:4px 0 8px">Cada barra es una semana. La línea separa las dos temporadas.</p>${legend()}</div><div class="chart-wrap"><svg id="ch-vol" role="img" aria-label="Volumen semanal por intensidad"></svg></div></div>
  <div class="panel charts" style="margin-top:16px"><div><h3>Cómo cambia la intensidad a lo largo de la temporada</h3><p class="muted" style="margin:4px 0 8px">Porcentaje del volumen por bloques de 9 semanas.</p></div><div class="chart-wrap"><svg id="ch-mix" role="img" aria-label="Porcentaje de intensidad por bloque"></svg></div></div>
  <h3 style="margin:22px 0 10px">Lo que muestran los datos</h3>
  <div style="display:grid;gap:10px;max-width:80ch">
   <div class="insight" style="--c:var(--z-aer)"><b>La base no se negocia.</b> El aeróbico se mantiene en ~${m1.aerobico}-${mt2.aerobico}% del volumen todo el año, y calentamiento, técnica y enfriamiento suman otro ~30%. Uno de cada tres metros es suave o técnico.</div>
   <div class="insight" style="--c:var(--z-vel)"><b>La velocidad crece hacia la competencia.</b> Pasa de ${m1.velocidad}% en las primeras 9 semanas a ${m4.velocidad}% en el bloque de mayo-junio. La segunda temporada arranca ya con ${mt2.velocidad}%.</div>
   <div class="insight" style="--c:var(--z-umb)"><b>Ondas de carga y descarga.</b> El volumen sube 3-4 semanas y luego baja: semanas 6→8, 10→17 (viajes y competencias), 22→25 y 35→36 (taper). El pico es la semana ${peak.n} con ${fmt(peak.v)}.</div>
   <div class="insight" style="--c:var(--z-alta)"><b>La alta intensidad es dosificada.</b> VO2máx, ANA y ritmo de carrera son solo ~${m1.alta||4}-${mt2.alta||5}% del volumen, siempre rodeados de trabajo aeróbico y recuperación activa.</div>
   <div class="insight" style="--c:var(--z-comb)"><b>El material es parte del plan.</b> Aletas aparecen en ${fmt(eqc['aletas']||0)} series, paletas en ${fmt(eqc['paletas']||0)}; paracaídas y cubetas se concentran en las tardes de velocidad (${fmt((eqc['paracaídas']||0)+(eqc['cubetas']||0))} series).</div>
   <div class="insight" style="--c:var(--z-rit)"><b>Doble sesión en bloques fuertes.</b> Las semanas de 8-9 sesiones (10, 29, 32, 35, 39) ponen la velocidad en la tarde y el volumen en la mañana.</div>
  </div>`;
}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function drawCharts(){
  const ws=WEEKS.filter(w=>w.n<=51);
  const svg=$('#ch-vol'); if(!svg) return;
  const W=Math.max(720,ws.length*16+60), H=280, L=46, B=30, T=10;
  const max=50000; const bw=(W-L-10)/ws.length;
  const y=v=>T+(H-T-B)*(1-v/max);
  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`;
  [0,10000,20000,30000,40000,50000].forEach(t=>{g+=`<line x1="${L}" x2="${W-6}" y1="${y(t)}" y2="${y(t)}" stroke="${css('--line')}" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="${css('--muted')}" font-family="IBM Plex Mono, monospace">${t/1000}k</text>`});
  ws.forEach((w,k)=>{ let acc=0; const x=L+k*bw+1; const tot=Object.values(w.mix).reduce((a,b)=>a+b,0)||1; const scale=(w.v||tot)/tot;
    BANDS.forEach(([b,,c])=>{ const v=(w.mix[b]||0)*scale; if(!v) return; const y0=y(acc), y1=y(acc+v); g+=`<rect x="${x}" y="${y1}" width="${Math.max(1,bw-2)}" height="${y0-y1}" fill="${css(c)}"><title>Semana ${w.n}: ${fmt(Math.round(v))}</title></rect>`; acc+=v; });
    if(w.n%5===0||w.n===1) g+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="${css('--muted')}" font-family="IBM Plex Mono, monospace">${w.n}</text>`;
  });
  const sx=L+ws.findIndex(w=>w.n===39)*bw-1; g+=`<line x1="${sx}" x2="${sx}" y1="${T}" y2="${H-B}" stroke="${css('--rope')}" stroke-dasharray="4 3"/><text x="${sx+4}" y="${T+12}" font-size="11" fill="${css('--rope')}">Temporada 2</text>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);  svg.innerHTML=g;
  const blocks=[[1,9,'Sem 1-9'],[10,18,'10-18'],[19,27,'19-27'],[28,36,'28-36'],[37,45,'37-45'],[46,51,'46-51']];
  const s2=$('#ch-mix'); const W2=720,H2=60+blocks.length*34; let g2='';
  blocks.forEach(([a,b,n],k)=>{ const m={}; WEEKS.filter(w=>w.n>=a&&w.n<=b).forEach(w=>Object.entries(w.mix).forEach(([kk,v])=>m[kk]=(m[kk]||0)+v)); const t=Object.values(m).reduce((x,y)=>x+y,0)||1;
    let x=90; const yy=20+k*34; g2+=`<text x="82" y="${yy+16}" text-anchor="end" font-size="12" fill="${css('--ink')}">${n}</text>`;
    BANDS.forEach(([bb,nn,c])=>{ const w=(W2-100)*(m[bb]||0)/t; if(w<=0) return; g2+=`<rect x="${x}" y="${yy}" width="${w}" height="22" fill="${css(c)}"><title>${nn}: ${Math.round(100*(m[bb]||0)/t)}%</title></rect>`; if(w>34) g2+=`<text x="${x+w/2}" y="${yy+15}" text-anchor="middle" font-size="11" fill="#fff" font-family="IBM Plex Mono, monospace">${Math.round(100*(m[bb]||0)/t)}%</text>`; x+=w; });
  });
  s2.setAttribute('viewBox',`0 0 ${W2} ${H2}`);  s2.innerHTML=g2;
}

function parseTime(t){ const m=String(t).trim().match(/^(?:(\d+):)?(\d+(?:[.,]\d+)?)$/); if(!m) return NaN; return (Number(m[1]||0))*60+Number(m[2].replace(',','.')); }
function paceHtml(t){ const s=parseTime(t); if(!(s>40)) return '<p class="muted">Escribe un tiempo válido, por ejemplo 1:45.0</p>'; const v=150/s;
  return ZONAS.map(([k,n,a,b])=>{const p100a=100/(v*a), p100b=100/(v*b); return `<div><span class="lbl">${k}</span><div style="font-size:12px" class="muted">${n}</div><b>${a===b?mmss(p100a):mmss(p100b)+' – '+mmss(p100a)}</b><div class="muted" style="font-size:12px">por 100 · 50: ${a===b?mmss(p100a/2):mmss(p100b/2)+'–'+mmss(p100a/2)}</div></div>`}).join(''); }
function calcTests(){
  const ce=$('#c-out'); if(ce){ const ai=+$('#c-age').value, sx=$('#c-sex').value, m=+$('#c-m').value; const r=COOPER[sx][ai]; let li=0; r.forEach((x,k)=>{ if(m>=x) li=k+1 }); ce.textContent=COOPER.levels[li]+' · '+Math.floor(m/25)+' × 25 m'; }
  const re=$('#r-out'); if(re){ const age=+$('#r-age').value, sx=$('#r-sex').value, lb=+$('#r-kg').value*2.20462, mn=+$('#r-min').value, fc=+$('#r-fc').value;
    const vo=132.853-0.0769*lb-0.3877*age+6.315*(sx==='M'?1:0)-3.2649*mn-0.1565*fc; const ai=age<30?0:age<40?1:age<50?2:age<60?3:4; const r=ROCK[sx][ai]; let li=0; r.forEach((x,k)=>{ if(vo>x) li=k+1 });
    re.textContent=isFinite(vo)?vo.toFixed(1)+' ml/kg/min · '+ROCK.levels[li]:'—'; }
  const ne=$('#n-out'); if(ne){ const n=NAV[+$('#n-et').value]; ne.textContent=(-24.4+6*n[0]).toFixed(1)+' ml/kg/min · '+fmt(n[2])+' m'; }
}

async function doPublish(){

  let id='l'+Date.now().toString(36), nube=false;

async function loadPlanes(){
  if(state.shared) return;
  let list=null;
  if(state.db&&state.user){ try{ const snap=await state.db.ref('entrenos_pro/planes').limitToLast(100).once('value'); const v=snap.val()||{}; list=Object.keys(v).map(k=>Object.assign({id:k},v[k])); }catch(e){ console.warn('firebase',e); } }
  const loc=LS.get('pubs',[]);
  if(list){ const ids=new Set(list.map(x=>x.id)); loc.forEach(x=>{ if(!ids.has(x.id)) list.push(x); }); } else list=loc;
  state.planes=list.sort((a,b)=>String(b.creado).localeCompare(String(a.creado))); state.planesState='ok';
}

function authErr(e){ return ({'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Contraseña incorrecta.','auth/user-not-found':'No existe esa cuenta.','auth/too-many-requests':'Demasiados intentos. Espera un momento.','auth/network-request-failed':'Sin conexión a internet.','auth/unauthorized-domain':'Este dominio no está autorizado en Firebase.'})[e&&e.code]||'No se pudo entrar. Intenta de nuevo.'; }

/* ---------- Eventos ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-close]'); if(!t) { if(e.target.id==='modal') closeModal(); return; }
  const d=t.dataset;
  if(d.tab){ state.tab=d.tab; state.viewPlan=null; save(); render(); window.scrollTo(0,0); return; }
  if(d.close!==undefined && t.matches('[data-close]')){ closeModal(); return; }
  if(d.seg){ state.vars[d.seg]=d.val; save(); render(); return; }
  if(d.act==='gen'){ readVars(); generate(); return; }
  if(d.act==='pdf'){ coachPDF(); return; }
  if(d.act==='frasereset'){ state.frase=fraseDeLaSemana(); LS.set('frase2',null); if(state.plan){state.plan.frase=state.frase; save();} render(); return; }
  if(d.act==='copylink'){ const ta=$('#lnk'); try{ await navigator.clipboard.writeText(ta.value); toast('Link copiado'); }catch(e){ ta.focus(); ta.select(); } return; }
  if(d.linkpub){ const p=state.planes.find(x=>x.id===d.linkpub); if(p) linkDialog(p); return; }
  if(d.act==='login'){ loginDialog(); return; }
  if(d.act==='logout'){ if(state.auth) state.auth.signOut(); return; }
  if(d.act==='google'){ if(!state.auth){ $('#lg-msg').textContent='Conectando…'; return; } const prov=new firebase.auth.GoogleAuthProvider(); state.auth.signInWithPopup(prov).catch(e=>{ if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){ state.auth.signInWithRedirect(prov); return; } if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request') $('#lg-msg').textContent=authErr(e); }); return; }
  if(d.act==='emaillogin'){ if(!state.auth) return; const em=$('#lg-e').value.trim(), pw=$('#lg-p').value; if(!em||!pw){ $('#lg-msg').textContent='Escribe tu correo y contraseña.'; return; } $('#lg-msg').textContent='Verificando…'; state.auth.signInWithEmailAndPassword(em,pw).catch(e=>{ $('#lg-msg').textContent=authErr(e); }); return; }
  if(d.pdfpub){ const p=state.planes.find(x=>x.id===d.pdfpub); if(p) swimmerPDF(p); return; }
  if(d.preset){ readVars(); Object.assign(state.vars,PRESETS[d.preset]); if(PRESETS[d.preset].enfoque!=='aguas') state.vars.salida=false; state.tab='disenar'; window.scrollTo(0,0); generate(); return; }
  if(d.act==='loadweek'){ loadWeek(+$('#v-sem').value); return; }
  if(d.act==='clear'){ state.plan=null; save(); render(); return; }
  if(d.act==='copy'){ closeModal(); copy(planToText(state.plan,(state.plan.vars||state.vars).estilo)); return; }
  if(d.act==='publish'){ publishDialog(); return; }
  if(d.act==='dopublish'){ doPublish(); return; }
  if(d.act==='addday'){ state.plan.days.push({d:'Día '+(state.plan.days.length+1),type:'AER',target:4000,sets:[]}); save(); render(); return; }
  if(d.rep){ const [a,b]=d.rep.split(':').map(Number); replaceSet(a,b); return; }
  if(d.del){ const [a,b]=d.del.split(':').map(Number); state.plan.days[a].sets.splice(b,1); save(); render(); return; }
  if(d.up){ const [a,b]=d.up.split(':').map(Number); if(b>0){const s=state.plan.days[a].sets; [s[b-1],s[b]]=[s[b],s[b-1]]; save(); render();} return; }
  if(d.ed){ const el=$(`[data-edit="${d.ed}"]`); el.setAttribute('contenteditable','true'); el.focus(); return; }
  if(d.regen){ regenDay(+d.regen); return; }
  if(d.delday){ state.plan.days.splice(+d.delday,1); save(); render(); return; }
  if(d.addset){ state.libFilter.sem=''; state.tab='biblioteca'; save(); render(); toast('Elige una serie y usa "+ Agregar a…"'); return; }
  if(d.custom){ openModal(`<h3>Escribir serie</h3><div class="field"><label class="lbl" for="cs-t">Serie</label><textarea id="cs-t" rows="3" placeholder="ej. 8 x 100 libre @ 1:30 a FC 150"></textarea></div><div class="row2"><div class="field"><label class="lbl" for="cs-v">Volumen</label><input id="cs-v" type="number" value="800"></div><div class="field"><label class="lbl" for="cs-c">Intensidad</label><select id="cs-c">${Object.entries(CLASES).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join('')}</select></div></div><div class="bar-actions"><button class="btn pri" data-savecustom="${d.custom}">Agregar</button><button class="btn" data-close>Cancelar</button></div>`); return; }
  if(d.savecustom){ const di=+d.savecustom; const c=$('#cs-c').value; state.plan.days[di].sets.push({i:null,fixed:true,t:$('#cs-t').value.trim()||'Serie',s:'',v:+$('#cs-v').value||0,c,r:c==='calentamiento'||c==='enfriamiento'||c==='tecnica'?c:'principal',e:[],p:''}); closeModal(); save(); render(); return; }
  if(d.open){ state.viewPlan=d.open; render(); window.scrollTo(0,0); return; }
  if(d.back!==undefined && t.matches('[data-back]')){ state.viewPlan=null; render(); return; }
  if(d.copypub){ const p=state.planes.find(x=>x.id===d.copypub); const mf=myF(p); copy(planToText({titulo:p.titulo,frase:p.frase,vars:{pool:p.unidad==='yd'?'25 yd':'25 m'},days:p.days.map(d=>({...d,sets:d.sets.map(s=>({...s,t:adaptText(s.t,mf),s:adaptText(s.s,mf),fixed:true}))})),seco:p.seco},p.estilo)); return; }
  if(d.editPub){ const p=state.planes.find(x=>x.id===d.editPub); state.plan={titulo:p.titulo+' (copia)',vars:Object.assign({},state.vars,{estilo:p.estilo,pool:p.unidad==='yd'?'25 yd':state.vars.pool}),days:JSON.parse(JSON.stringify(p.days)).map(x=>({...x,sets:x.sets.map(s=>({...s,i:null,e:[],r:s.r||(s.c==='calentamiento'||s.c==='enfriamiento'||s.c==='tecnica'?s.c:'principal'),fixed:true}))})),seco:p.seco,creado:new Date().toISOString(),origen:'publicada'}; state.tab='disenar'; save(); render(); return; }
  if(d.unpub){ if(t.dataset.confirm!=='1'){ t.dataset.confirm='1'; t.textContent='¿Seguro? Toca otra vez'; return; } LS.set('pubs',LS.get('pubs',[]).filter(x=>x.id!==d.unpub)); if(state.db&&state.user){ try{ await state.db.ref('entrenos_pro/planes/'+d.unpub).remove(); }catch(err){} } await loadPlanes(); render(); toast('Quitada de la lista (el link sigue funcionando)'); return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.addto!==undefined && t.value!==''){ const s=BYID[+t.dataset.addto]; state.plan.days[+t.value].sets.splice(-1,0,{i:s.i,t:s.t,s:s.s,v:s.v,c:s.c,r:s.r,e:s.e,p:s.p}); save(); toast('Agregada a '+state.plan.days[+t.value].d); t.value=''; return; }
  if(t.dataset.daytype!==undefined){ state.plan.days[+t.dataset.daytype].type=t.value; save(); render(); return; }
  if(t.dataset.done){ const [id,k]=t.dataset.done.split('|'); const m=LS.get('done:'+id,{}); m[k]=t.checked; LS.set('done:'+id,m); t.closest('.set').classList.toggle('done',t.checked); return; }
  if(t.dataset.eq!==undefined || ['v-vol','v-ses','v-pool','v-fase','v-estilo','v-seco','v-nivel','v-ref','v-salida'].includes(t.id)){ readVars(); save(); if(state.plan&&['v-estilo','v-nivel','v-ref','v-pool'].includes(t.id)){state.plan.vars=Object.assign({},state.plan.vars||{},{estilo:state.vars.estilo,ref100:state.vars.ref100,pool:state.vars.pool}); save();} if(['v-estilo','v-nivel','v-ref','v-pool'].includes(t.id)) render(); return; }
  if(t.id==='v-frase'){ render(); return; }
  if(t.id&&t.id.startsWith('f-')){ state.libFilter[t.id.slice(2)]=t.value; render(); return; }
  if(['c-age','c-sex','c-m','r-age','r-sex','r-kg','r-min','r-fc','n-et'].includes(t.id)) calcTests();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-q'){ clearTimeout(t._d); t._d=setTimeout(()=>{ state.libFilter.q=t.value; const pos=t.selectionStart; render(); const n=$('#f-q'); n.focus(); n.setSelectionRange(pos,pos); },250); }
  if(t.id==='my100'){ clearTimeout(t._d); t._d=setTimeout(()=>{ LS.set('my100',t.value); const pos=t.selectionStart; render(); const n=$('#my100'); if(n){n.focus(); n.setSelectionRange(pos,pos);} },500); }
  if(t.id==='v-frase'){ state.frase=t.value.trim(); LS.set('frase2',{k:SEMKEY,f:state.frase}); if(state.plan){ state.plan.frase=state.frase; save(); } }
  if(t.id==='v-club'){ state.club=t.value.trim(); LS.set('club',state.club); }
  if(t.id==='t150'){ LS.set('t150',{t:t.value}); $('#pace').innerHTML=paceHtml(t.value); }
  if(['c-m','r-age','r-kg','r-min','r-fc'].includes(t.id)) calcTests();
});
document.addEventListener('focusout',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.edit&&t.getAttribute('contenteditable')==='true'){ const [a,b]=t.dataset.edit.split(':').map(Number); const s=state.plan.days[a].sets[b]; s.t=t.innerText.trim(); s.s=''; s.i=null; s.fixed=true; t.removeAttribute('contenteditable'); save(); render(); }
  if(t.id==='plan-title'){ state.plan.titulo=t.innerText.trim(); save(); }
});
function readVars(){
  const v=state.vars; const g=id=>document.getElementById(id); if(!g('v-vol')) return;
  v.vol=Math.max(3000,+g('v-vol').value||30000); v.ses=+g('v-ses').value; v.pool=g('v-pool').value; v.fase=g('v-fase').value; v.estilo=g('v-estilo').value; v.seco=g('v-seco').checked;
  const rf=g('v-ref').value.trim(); const rs=rf?secs(rf.replace(/\.\d+$/,'')):NaN; v.ref100= rs>30&&rs<300 ? rs : (+g('v-nivel').value||60);
  if(g('v-salida')) v.salida=g('v-salida').checked;
  v.equipo=[...document.querySelectorAll('[data-eq]')].filter(x=>x.checked).map(x=>x.dataset.eq);
}

render(); if(state.tab==='pruebas') calcTests();
const obs=new MutationObserver(()=>{ if($('#c-out')&&!$('#c-out').textContent) calcTests(); }); obs.observe($('#app'),{childList:true});

}

function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); }
function readShared(){ const m=location.hash.match(/[#&]s=([^&]+)/); if(!m||!window.LZString) return null; try{ const o=JSON.parse(LZString.decompressFromEncodedURIComponent(m[1])); return o&&o.days?Object.assign(o,{id:'s'+hashStr(m[1])}):null; }catch(e){ return null; } }
